<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인생게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== 0. 로그인 화면 ========== -->
  <div id="loginScreen" class="screen">
    <img class="logo small-logo" src="assets/ui/logo.svg" alt="인생게임">
    <div class="login-box">
      <div class="login-tabs">
        <button id="tabLogin" class="selected" onclick="setLoginTab('login')">로그인</button>
        <button id="tabRegister" onclick="setLoginTab('register')">회원가입</button>
      </div>
      <input type="text" id="loginId" placeholder="아이디" maxlength="30">
      <input type="password" id="loginPw" placeholder="비밀번호" maxlength="50">
      <input type="text" id="loginNick" class="hidden" placeholder="닉네임" maxlength="20">
      <p id="loginMsg"></p>
      <button id="loginBtn" class="big-btn" onclick="submitLogin()">로그인</button>
      <button class="text-btn" onclick="playAsGuest()">게스트로 플레이 ▶</button>
    </div>
  </div>

  <!-- ========== 1. 타이틀 화면 ========== -->
  <div id="titleScreen" class="screen hidden">
    <div id="userBar"></div>
    <img id="logoImg" class="logo" alt="인생게임">
    <p class="subtitle">아기부터 노년까지, 당신의 인생은 어떻게 될까요?</p>
    <div id="titleChars"></div>
    <button class="big-btn" onclick="showScreen('setupScreen')">게임 시작</button>
    <button class="big-btn blue" onclick="openRanking()">🏆 랭킹</button>
  </div>

  <!-- ========== 2. 플레이어 설정 화면 ========== -->
  <div id="setupScreen" class="screen hidden">
    <h2 class="screen-title">플레이어 설정</h2>
    <div id="modeBox"></div>
    <div class="count-btns">
      <span class="setup-label">👤 사람</span>
      <button id="count1" onclick="setPlayerCount(1)">1명</button>
      <button id="count2" onclick="setPlayerCount(2)">2명</button>
      <button id="count3" onclick="setPlayerCount(3)">3명</button>
      <button id="count4" onclick="setPlayerCount(4)">4명</button>
    </div>
    <div id="botBox"></div>
    <div id="slots"></div>
    <button class="big-btn" onclick="startGame()">인생 시작!</button>
  </div>

  <!-- ========== 3. 게임 화면 ========== -->
  <div id="gameScreen" class="hidden">
    <!-- 지도 (스크롤 가능) -->
    <div id="mapArea">
      <div id="mapWrap">
        <div id="map"></div>
      </div>
      <!-- 지도 위 상태바 (왼쪽 위 : 지금 차례인 사람, 오른쪽 위 : 턴) -->
      <div id="hud"></div>
      <div id="turnHud"></div>

      <!-- 왼쪽 아래 메뉴 (닌텐도 인생게임처럼) -->
      <div id="menu">
        <button id="spinBtn" class="menu-btn" onclick="spin()">🎡 룰렛</button>
        <button id="cardMenuBtn" class="menu-btn" onclick="openPanel('card')">🎴 카드</button>
        <button class="menu-btn" onclick="openPanel('status')">📋 상태</button>
        <button class="menu-btn" onclick="openPanel('etc')">⚙️ 기타</button>
      </div>
      <button id="zoomBtn" class="map-btn" onclick="toggleZoom()">🗺️ 전체 지도</button>

      <!-- 메뉴 창 (카드 / 상태 / 기타) -->
      <div id="menuPanel" class="hidden"></div>
    </div>

    <!-- 오른쪽 패널 -->
    <div id="side">
      <div class="panel" id="turnPanel">
        <div id="turnInfo">
          <img id="turnImg" alt="">
          <div id="turnName"></div>
        </div>
        <div id="wheelBox">
          <div id="pointer"></div>
          <img id="wheelImg" alt="룰렛">
        </div>
        <div id="rollText"></div>
      </div>

      <div class="panel">
        <h3>플레이어</h3>
        <div id="playerList"></div>
      </div>

      <div class="panel">
        <h3>칸 설명</h3>
        <div id="legend"></div>
      </div>

      <div class="panel">
        <h3>기록</h3>
        <ul id="log"></ul>
      </div>
    </div>
  </div>

  <!-- ========== 4. 결과 화면 ========== -->
  <div id="resultScreen" class="screen hidden">
    <h2 class="screen-title">📜 인생 보고서</h2>
    <div id="ranking"></div>
    <p id="saveMsg" class="rule"></p>
    <button class="big-btn" onclick="location.reload()">다시 하기</button>
  </div>

  <!-- ========== 랭킹 화면 ========== -->
  <div id="rankingScreen" class="screen hidden">
    <h2 class="screen-title">🏆 명예의 전당</h2>
    <div id="rankingList" class="panel ranking-panel"></div>
    <button class="big-btn" onclick="showScreen('titleScreen')">돌아가기</button>
  </div>

  <!-- ========== 팝업 창 ========== -->
  <div id="popup" class="hidden">
    <div class="popup-card">
      <img id="popupImg" alt="">
      <h2 id="popupTitle"></h2>
      <div id="popupText"></div>
      <div id="popupButtons"></div>
    </div>
  </div>

  <!-- ========== 미니게임 창 ========== -->
  <div id="mini" class="hidden">
    <div class="popup-card mini-card">
      <h2 id="miniTitle"></h2>
      <div id="miniBody"></div>
    </div>
  </div>

  <!-- ========== 🎡 확률 룰렛 창 (X 실패 / O 성공 / ◎ 대성공) ========== -->
  <div id="chance" class="hidden">
    <div class="popup-card chance-card">
      <h2 id="chanceTitle"></h2>
      <div id="chanceText"></div>
      <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <div id="chanceWheel"></div>
      </div>
      <div id="chanceResult"></div>
      <button id="chanceBtn" class="big-btn">룰렛 돌리기!</button>
    </div>
  </div>

  <!-- 🎵 배경음악 / 🔊 효과음 켜기 · 끄기 (모든 화면 오른쪽 아래) -->
  <div id="soundBox">
    <button id="musicBtn" onclick="toggleMusic()">🎵</button>
    <button id="sfxBtn" onclick="toggleSound()">🔊</button>
  </div>

  <!-- 순서 중요! 데이터 → 서버 연결 → 소리 → 게임 -->
  <script src="map.js"></script>
  <script src="events.js"></script>
  <script src="api.js"></script>
  <script src="sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
